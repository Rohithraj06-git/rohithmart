# RohithMart Application Configuration
# Environment: local / development / production
app.env=development
app.name=RohithMart
app.url=http://localhost:8080/rohithmart

# Database Configuration (H2)
# Embedded development mode with auto-server enabled:
db.driver=org.h2.Driver
db.url=jdbc:h2:./data/rohithmart;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
db.user=sa
db.password=

# HikariCP Connection Pool
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000

# Session Configuration
session.timeoutMinutes=30

# AI Chatbot Configuration
ai.chatbot.provider=mock
ai.gemini.apiKey=
ai.timeoutSeconds=10
ai.rateLimitPerMinute=10
