# ==============================================================================
# RohithMart Application & Database Configuration
# Anna University R2025 Semester 3 Capstone Project
# ==============================================================================

# Application Meta
app.env=development
app.name=RohithMart
app.url=http://localhost:8080/rohithmart

# H2 Database Engine Configuration
# Embedded mode with AUTO_SERVER=TRUE enables both app and external H2 Console connections
db.driver=org.h2.Driver
db.url=jdbc:h2:./data/rohithmart;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
db.user=sa
db.password=

# HikariCP Managed Connection Pool Configuration
# Prevents connection starvation, timeouts, and resource leaks
db.pool.name=RohithMartHikariPool
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000
db.pool.leakDetectionThreshold=60000

# Automated Database Migrations & Seeding
db.migration.autoRun=true
db.seed.autoRun=true

# Session Management
session.timeoutMinutes=30

# AI Chatbot Assistant Configuration
ai.chatbot.provider=mock
ai.gemini.apiKey=
ai.timeoutSeconds=10
ai.rateLimitPerMinute=10
